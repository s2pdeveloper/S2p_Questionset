<div class="container-fluid animated fadeIn">
  <div class="card">
    <div class="card-header">
      <div class="row justify-content-between align-items-center">
        <div class="col-auto">
          <h3 class="mb-0">Feedback Form</h3>
        </div>
        <div class="col-auto">
          <button type="button" class="btn btn-danger" (click)="goBack()">
            <i class="fa fa-arrow-left me-1" aria-hidden="true"></i>
            Back
          </button>
        </div>
      </div>
    </div>
    <div class="card-body">
      <form [formGroup]="tagsForm" class="form-horizontal">
        <div class="row justify-content-start">
          <div class="col-md-12">
            <div class="mb-3">
              <label class="form-label">
                Tags Name
                <span class="text-danger">*</span>
              </label>
              <input
                formControlName="tagsForm"
                type="text"
                class="form-control"
                placeholder="Enter Question Statement"
                [ngClass]="{
                  'is-invalid':
                    form.tagsForm.invalid &&
                    submitted &&
                    (form.tagsForm.touched || form.tagsForm.dirty)
                }"
              />
              <validation-messages [control]="form['tagsForm']">
              </validation-messages>
            </div>
          </div>
        </div>
      </form>
      <div class="text-center">
        <button
          [disabled]="act === 'view'"
          (click)="submit()"
          type="submit"
          class="btn btn-success text-white"
        >
          {{ form._id.value ? "Update" : "Save" }}
        </button>
        <button (click)="goBack()" class="btn btn-danger">Cancel</button>
      </div>
    </div>
  </div>
</div>
