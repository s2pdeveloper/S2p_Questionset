  <div class="container pt-5" *ngIf="!startButton">
    <div class="row justify-content-center">
      <div class="col-12 col-xs-12 col-sm-12 col-md-11 col-lg-8 col-xl-8 mb-4">
        <div class="card">
          <div
            class="card-header d-flex justify-content-between bg-primary p-2 px-3"
          >
            <h2 class="text-center text-white head-text">Feedback Form</h2>
          </div>

          <div class="card-body p-4">
            <form>
              <div
                class="head mb-2"
                *ngFor="let que of questions; let i = index"
              >
                <div class="mb-2">
                  <p>
                    <strong>{{ i + 1 }}. {{ que?.question }}</strong>
                  </p>
                  <img
                    *ngIf="que?.queImageUrl"
                    [src]="que?.queImageUrl"
                    alt=""
                    class="queImg"
                  />
                </div>

                <div class="div mx-3">
                  <div
                    class="form-check text"
                    *ngFor="let option of que?.options"
                  >
                    <label>
                      <input
                        id="checkbox-{{ i }}"
                        (click)="answerChange(option, i, $event)"
                        class="form-check-input"
                        type="checkbox"
                        [checked]="selectedAnswers[i] === option"
                      />

                      {{ option }}
                    </label>
                  </div>
                </div>
              </div>
              <div class="text-center">
                <button class="btn btn-primary xl" (click)="submit()">
                  Submit
                </button>
              </div>
            </form>
            <!-- <div class="circle">
              {{ timeRemaining }}

            </div> -->
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="container pt-5" *ngIf="startButton">
    <div class="row justify-content-center">
      <div class="col-12 col-xs-12 col-sm-12 col-md-11 col-lg-6 col-xl-6 mb-4">
        <div class="card">
          <!-- <div
          class="card-header d-flex justify-content-center bg-primary p-2 px-3"
        >
          <h2 class="text-center text-white head-text">Thank You</h2>
        </div> -->
         

          <div class="card-body p-4">
          <div class="row justify-content-center">

            <div class="col-10 text-center">
              <img
                src="../../assets/images/feedback.jpg"
                alt=""
                class="img-fluid"
              />
              <h2 class="text-center text-dark head-text">Feedback submitted !!</h2>
            </div>
          </div>
        </div>

        </div>
      </div>
    </div>
  </div>
</div>
